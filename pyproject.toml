[project]
name = "easyread"
version = "1.5.2"
description = "PaperRead：论文阅读、批注、研究探索与文献管理"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["paper", "translation", "reader", "arxiv", "llm", "论文翻译"]
dependencies = [
  "pypdfium2>=4.30",
  "pdfplumber>=0.11",
  "pillow>=10",
  "pypdf>=4",
  "truststore>=0.10",
  "certifi>=2024.8.30",
  "opencc-python-reimplemented>=0.1.7,<0.2",
  "fastembed>=0.7.1,<0.8",
]

[project.scripts]
easyread = "easyread.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["easyread*"]

[tool.setuptools.package-data]
easyread = ["check_tex.js", "web/*", "web/**/*"]
