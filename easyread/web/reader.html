<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PaperRead</title>
<link rel="icon" href="/web/paperread-mark.png" type="image/png">
<link rel="stylesheet" href="/web/vendor/katex/katex.min.css">
<link rel="stylesheet" href="/web/vendor/mind-elixir/MindElixir.css">
<link rel="stylesheet" href="/web/css/base.css">
<link rel="stylesheet" href="/web/css/dropdown.css">
<link rel="stylesheet" href="/web/css/research-task-monitor.css">
<link rel="stylesheet" href="/web/css/reader.css">
<link rel="stylesheet" href="/web/css/stickers.css">
<link rel="stylesheet" href="/web/css/figure-zoom.css">
<link rel="stylesheet" href="/web/css/reading-language.css">
<link rel="stylesheet" href="/web/css/sentences.css">
<link rel="stylesheet" href="/web/css/reader-panels.css">
<link rel="stylesheet" href="/web/vendor/note-libraries.css">
<link rel="stylesheet" href="/web/css/paper-note-editor.css">
<link rel="stylesheet" href="/web/css/reader-chat.css">
<link rel="stylesheet" href="/web/css/research.css">
<link rel="stylesheet" href="/web/css/settings.css">
<link rel="stylesheet" href="/web/css/page-cap.css">
<link rel="stylesheet" href="/web/css/usage.css">
<script>try{var p=JSON.parse((localStorage.getItem("easyread-prefs")||localStorage.getItem("coread-prefs"))||"{}");var d=p.theme==="dark"||(p.theme!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.dataset.theme=d?"dark":"light"}catch(e){}</script>
</head>
<body>
<div id="progress" aria-hidden="true"><i></i></div>

<header class="topbar" id="bar">
  <a class="btn brand-back" id="backBtn" href="/" title="回文献库"></a>
  <button class="btn icon" data-act="drawer" title="目錄（T）"></button>
  <div class="bar-titles">
    <span class="bar-title"></span>
    <span class="bar-section"></span>
  </div>
  <span class="grow"></span>
  <span class="job-state" id="jobState"></span>
  <div class="seg view-seg" role="group" aria-label="正文显示">
    <button data-view="original"></button>
    <button data-view="translation"></button>
    <button data-view="both"></button>
    <button class="order-caret" data-order-menu aria-haspopup="menu" aria-expanded="false"></button>
  </div>
  <button class="btn" data-act="pages" title="PDF 原頁，跟隨閱讀位置（O）"></button>
  <button class="btn ink-toggle" id="inkToggle" aria-pressed="false" title="手寫註記（W）"><svg class="i sm" viewBox="0 0 20 20" aria-hidden="true"><path d="M13.8 3.2l3 3-8.7 8.7-3.8.8.8-3.8zM3.5 17h13"></path></svg><span>手寫</span></button>
  <button class="btn" id="stickerToggle" type="button" aria-expanded="false" aria-controls="stickerPanel" title="貼紙素材庫（S）"><svg class="i sm" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 3.5h12v9l-4 4H4zM12 16.5v-4h4"></path></svg><span>貼紙</span></button>
  <button class="btn" data-act="notes" title="筆記面板（M）"></button>
  <button class="btn" data-act="chat" title="邊讀邊問 AI（A）"></button>
  <button class="btn" title="研究（R）" data-act="research"></button>
  <button class="btn" data-act="settings" title="字號、版心、字體（=、- 調字號）">Aa</button>
  <button class="save-state" data-act="about" title="保存状态"><i></i><span>…</span></button>
</header>

<aside id="drawer" aria-label="目录">
  <div class="drawer-tabs" role="tablist">
    <button data-tab="toc" class="on">目录</button>
    <button data-tab="terms">术语</button>
    <button data-tab="about">说明</button>
    <button data-tab="recent" class="server-only">最近</button>
  </div>
  <div class="drawer-body"></div>
</aside>
<div id="scrim"></div>

<main id="stage">
  <aside id="margin-left" aria-label="我的註記"></aside>
  <article id="paper" lang="zh-CN"></article>
  <aside id="margin" aria-label="讨论与笔记"></aside>
  <svg id="inkLayer" aria-label="手寫註記畫布"></svg>
</main>
<div id="inkTools" role="toolbar" aria-label="手寫工具" hidden>
  <div class="ink-tool-group" role="group" aria-label="筆色">
    <button type="button" class="ink-swatch" data-ink-color="#1d1d1d" aria-label="黑筆" title="黑筆" aria-pressed="true"><i></i></button>
    <button type="button" class="ink-swatch" data-ink-color="#d94b4b" aria-label="紅筆" title="紅筆"><i></i></button>
    <button type="button" class="ink-swatch" data-ink-color="#2878c8" aria-label="藍筆" title="藍筆"><i></i></button>
    <button type="button" class="ink-swatch" data-ink-color="#27845b" aria-label="綠筆" title="綠筆"><i></i></button>
    <label class="ink-swatch ink-custom" title="自訂顏色"><input type="color" data-ink-custom value="#6d5bd0" aria-label="自訂顏色"><i></i></label>
  </div>
  <details class="ink-width" id="inkWidth">
    <summary title="筆寬"><svg class="i sm" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 14.5h12M6.5 10h7M8.5 5.5h3"></path></svg><span>筆寬</span></summary>
    <label><span>筆寬</span><input type="range" data-ink-width min="1" max="12" step="1" value="2" aria-label="筆寬"></label>
  </details>
  <span class="ink-tool-divider" aria-hidden="true"></span>
  <div class="ink-width ink-eraser"><button type="button" class="ink-action" data-ink-erase aria-pressed="false" aria-expanded="false" aria-controls="eraserSize" title="橡皮擦（X）"><svg class="i sm" viewBox="0 0 20 20" aria-hidden="true"><path d="M6.1 4.1l8.8 8.8-3.5 3.5H6.8l-3.1-3.1zM3.7 13.4h9.1"></path></svg><span>橡皮擦</span></button><label id="eraserSize" data-eraser-size hidden><span>橡皮擦大小</span><input type="range" data-eraser-width min="8" max="80" step="2" value="24" aria-label="橡皮擦大小"></label></div>
  <button type="button" class="ink-action" data-ink-lasso aria-pressed="false" title="套索選取"><svg class="i sm" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5.5c2.8-2.8 8.5-2.7 10.2.4 1.5 2.7-.8 6.6-4.7 7.5-3.8.9-7.2-1.2-6.6-4.6.4-2.6 3.7-3.3 5.5-1.8 1.4 1.2.5 3.2-1.1 3.1M8.3 10.2l-2.7 4.3"></path></svg><span>套索選取</span></button>
  <button type="button" class="ink-action" data-ink-text aria-pressed="false" title="插入文字方塊"><svg class="i sm" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5V3h14v2M10 3v14M7 17h6"></path></svg><span>插入文字方塊</span></button>
  <button type="button" class="ink-action" data-ink-undo title="復原（Ctrl/⌘ + Z）"><svg class="i sm" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 5L3.5 8.5 7 12M4 8.5h7a4.5 4.5 0 1 1 0 9"></path></svg><span>復原</span></button>
  <button type="button" class="ink-action" data-ink-redo title="重做（Ctrl/⌘ + Shift + Z）"><svg class="i sm" viewBox="0 0 20 20" aria-hidden="true"><path d="M13 5l3.5 3.5L13 12m3.5-3.5h-7a4.5 4.5 0 1 0 0 9"></path></svg><span>重做</span></button>
  <button type="button" class="ink-action" data-ink-hide aria-pressed="false" title="隱藏筆跡"><svg class="i sm" viewBox="0 0 20 20" aria-hidden="true"><path d="M2.5 10s2.7-4.5 7.5-4.5S17.5 10 17.5 10 14.8 14.5 10 14.5 2.5 10 2.5 10zM10 12a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"></path></svg><span data-ink-hide-label>隱藏筆跡</span></button>
</div>

<section id="stickerPanel" role="dialog" aria-label="貼紙素材庫" hidden></section>
<div id="stickerTools" role="toolbar" aria-label="貼紙工具" hidden></div>
<section id="pageview" class="side-panel" aria-label="PDF 原页">
  <div class="pv-head">
    <button class="btn icon" data-pv="prev" title="上一頁（[）">‹</button>
    <span class="pv-label"></span>
    <button class="btn icon" data-pv="next" title="下一頁（]）">›</button>
    <span class="grow"></span>
    <label class="pv-follow" title="左右双向跟随阅读位置"><input type="checkbox" checked> 跟随</label>
    <a class="btn sm" data-pv="pdf" target="_blank" rel="noopener">PDF</a>
    <button class="btn icon" data-pv="close" title="關閉（O）">×</button>
  </div>
  <div class="pv-zoom" role="group" aria-label="PDF 缩放">
    <button class="btn icon" data-pv-zoom="out" title="缩小 PDF">−</button>
    <span class="pv-zoom-value" aria-live="polite">100%</span>
    <button class="btn icon" data-pv-zoom="in" title="放大 PDF">+</button>
    <button class="btn sm" data-pv-zoom="fit" title="恢复适合宽度">适合宽度</button>
  </div>
  <div class="pv-scroll"><div class="pv-page"><img alt=""><div class="pv-hl"></div></div></div>
</section>

<section id="notespanel" class="side-panel" aria-label="笔记"></section>
<section id="chatpanel" class="side-panel" aria-label="问 AI"></section>
<section id="researchpanel" class="side-panel" aria-label="研究知识工作区"></section>
<div class="dialog-backdrop" id="readerDlg"><div class="dialog" role="dialog"></div></div>
<div class="dialog-backdrop" id="settingsDlg"><div class="dialog" role="dialog" aria-label="设置"></div></div>
<div class="dialog-backdrop" id="textDlg"><div class="dialog wide" role="dialog"></div></div>
<div class="dialog-backdrop" id="mindmapDlg"><div class="dialog mm-dialog" role="dialog" aria-label="論文心智圖"></div></div>
<div class="dialog-backdrop" id="deepReportDlg"><div class="dialog deep-dialog" role="dialog" aria-label="論文深度剖析報告"></div></div>

<div id="settings" class="menu" role="dialog" aria-label="阅读设置"></div>
<div id="popover" class="popover" role="tooltip"></div>
<div id="selbar" class="popover" role="toolbar"></div>
<div id="blockbar" class="popover" role="toolbar"></div>
<div id="toast" role="status"></div>

</body>
</html>
